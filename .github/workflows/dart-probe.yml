name: DART 원문 구조 진단 (수동 실행)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python tools/dart_probe.py
