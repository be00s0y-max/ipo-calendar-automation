name: 공모주 캘린더 자동 갱신

on:
  schedule:
    # 매 영업일(월~금) 08:00 KST = 전날 23:00 UTC
    - cron: "0 23 * * 0-4"
    # 매 영업일(월~금) 15:00 KST = 당일 06:00 UTC
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run calendar update (38.co.kr 딜 목록/일정)
        id: calendar
        run: |
          set +e
          python update_calendar_data.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run DART update (종목 상세정보)
        id: dart
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set +e
          python update_dart_data.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stamp last-updated date
        run: |
          python - <<'PY'
          import re, datetime, zoneinfo
          path = "ipo_calendar.html"
          WD = ["월", "화", "수", "목", "금", "토", "일"]  # Python weekday(): Mon=0..Sun=6
          now = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Seoul"))
          stamp = f"{now.month}.{now.day}({WD[now.weekday()]}) {now.strftime('%H:%M')}"
          html = open(path, encoding="utf-8").read()
          html = re.sub(
              r'(// AUTO-GENERATED:LAST_UPDATED:START\nconst LAST_UPDATED_KST = ")[^"]*(";)',
              lambda m: m.group(1) + stamp + m.group(2),
              html,
          )
          open(path, "w", encoding="utf-8").write(html)
          PY

      - name: Commit and push if changed
        if: steps.calendar.outputs.exit_code == '0' || steps.dart.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "공모주 캘린더 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
